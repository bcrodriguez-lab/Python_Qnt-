<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contactate con los asesores de QNT, Rebancarizate ya.</title>
    
    <!-- Google Fonts & Material Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">

    <style>
        :root {
            --azul: #104975;
            --azul-brillante: #0b50da;
            --cian: #01eada;
            --blanco: #fff;
            --sombra: 0 4px 24px rgba(16,73,117,.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--blanco);
            color: var(--azul);
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        /* ===== HEADER ===== */
        .header {
            background: var(--azul-brillante);
            padding: 16px 24px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 12px rgba(11,80,218,.25);
        }
        .header-inner {
            max-width: 1280px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }
        .logo { height: 40px; width: auto; }

        .btn-portal {
            background: var(--cian);
            color: var(--azul);
            border: none;
            padding: 10px 24px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: all .2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            text-decoration: none;
        }
        .btn-portal:hover { background: #00d4c8; transform: scale(1.03); }
        .btn-portal .material-symbols-outlined { font-size: 20px; }

        /* ===== CONTENIDO CENTRAL ===== */
        .main-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 48px 24px;
        }
        .card-centro {
            text-align: center;
            max-width: 480px;
            width: 100%;
        }
        .icono-telefono {
            width: 80px;
            height: 80px;
            background: var(--azul);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
        }
        .icono-telefono .material-symbols-outlined {
            font-size: 40px;
            color: var(--cian);
        }
        .card-centro h1 {
            font-size: 28px;
            font-weight: 700;
            color: var(--azul);
            margin-bottom: 12px;
        }
        .card-centro p {
            font-size: 16px;
            color: #475569;
            margin-bottom: 32px;
        }
        .btn-llamar {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 16px 40px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 18px;
            border: none;
            cursor: pointer;
            transition: all .2s ease;
            text-decoration: none;
            background: var(--cian);
            color: var(--azul);
        }
        .btn-llamar:hover { background: #00d4c8; transform: scale(1.03); }
        .btn-llamar .material-symbols-outlined { font-size: 24px; }

        /* ===== FOOTER ===== */
        .footer {
            background: var(--azul);
            color: rgba(255,255,255,.7);
            text-align: center;
            padding: 20px 24px;
            font-size: 13px;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .header { padding: 12px 16px; }
            .logo { height: 32px; }
            .btn-portal { font-size: 13px; padding: 8px 18px; }
            .card-centro h1 { font-size: 24px; }
            .icono-telefono { width: 64px; height: 64px; }
            .icono-telefono .material-symbols-outlined { font-size: 32px; }
            .btn-llamar { font-size: 16px; padding: 14px 32px; }
        }
    </style>
</head>

<body>

    <!-- ===== HEADER ===== -->
    <header class="header">
        <div class="header-inner">
            <img class="logo" src="https://qnt.com.co/wp-content/uploads/2025/10/da0fa8ed19c118e5437a65b3d5bad2c4.svg" alt="QNT" />
            <a href="https://portalclientes.qnt.com.co/inicio" target="_blank" class="btn-portal">
                <span class="material-symbols-outlined">login</span> Portal Clientes
            </a>
        </div>
    </header>

    <!-- ===== CONTENIDO CENTRAL ===== -->
    <main class="main-content">
        <div class="card-centro">
            <div class="icono-telefono">
                <span class="material-symbols-outlined">call</span>
            </div>
            <h1>Contáctate con los asesores de QNT</h1>
            <p>Estamos redirigiendo tu llamada. Si no se abre automáticamente, toca el botón de abajo.</p>
            <a href="tel:6019183131" class="btn-llamar">
                <span class="material-symbols-outlined">phone_in_talk</span> Llamar ahora
            </a>
        </div>
    </main>

    <!-- ===== FOOTER ===== -->
    <footer class="footer">
        QNT S.A.S. · Todos los derechos reservados
    </footer>

    <!-- ===== SCRIPT DE REDIRECCIÓN ===== -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            window.location.href = "tel:6019183131";
        });
    </script>

</body>
</html>
